# Fly.io config. Change `app` to a globally unique name, then: fly launch --copy-config --no-deploy && fly deploy
app = "raft-kv-demo"
primary_region = "bom" # Mumbai

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when nobody is watching (free tier friendly)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
